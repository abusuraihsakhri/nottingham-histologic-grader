version: '3.8'

services:
  nottingham-histologic-grader:
    build: .
    container_name: nottingham-histologic-grader
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=nottingham-histologic-grader-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
