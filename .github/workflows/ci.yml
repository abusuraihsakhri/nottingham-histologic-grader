name: Nottingham Histologic Grader CI/CD & Security Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install 'fastapi>=0.110,<1' 'uvicorn>=0.30,<1' 'pydantic>=2,<3' pytest httpx

    - name: Run Pytest Suite
      run: |
        pytest -v

    - name: Validate Python source and CLI grading
      run: |
        python -m compileall -q .
        python nottingham_grader.py single --v1 1 --v2 2 --v3 3
        python nottingham_grader.py batch -i sample.csv -o results.csv

    - uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Test browser algorithm and CSV workflow
      run: |
        node --check web/core.js
        node --check web/batch.js
        node --check web/app.js
        node --test tests/test_web.cjs

    - name: Audit chain integrity smoke test
      run: |
        python -c "
        from agents.base import PHIGuard, AuditLogger
                assert AuditLogger.verify_integrity() is True
        print('Security & Zero-PHI Audit Passed!')
        "
